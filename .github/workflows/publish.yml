# Canonical npm publish path — CI-only publishing.
#
# This workflow is the ONLY sanctioned way to publish `biztalk-migrate` to npm.
# Do not run `npm publish` from a developer machine.
#
# Release process:
#   1. Bump the version in package.json (+ package-lock.json) on main and commit.
#   2. Tag the commit:  git tag v<X.Y.Z> && git push origin v<X.Y.Z>
#      (or create a GitHub Release for that tag — both triggers work; the
#      concurrency group prevents a double publish).
#   3. This workflow verifies the tag matches package.json, runs
#      typecheck + lint + tests + build, then publishes with npm provenance.
#
# Required repository secret (configure in GitHub → Settings → Secrets → Actions):
#   NPM_TOKEN — npm automation token (npmjs.com → Access Tokens → Automation)
#               with publish rights on the `biztalk-migrate` package.
#               Exposed to npm as NODE_AUTH_TOKEN at the publish step only.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance (OIDC)

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Skip if version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "biztalk-migrate@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "biztalk-migrate@$PKG_VERSION already on npm — skipping publish (duplicate trigger)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
